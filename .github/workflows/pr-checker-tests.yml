name: Pr Checker - Tests

on:
  pull_request:
    types: [edited, synchronize, opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  pr-test-check:
    permissions:
      issues: write
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'

      - name: Install packages
        run: |
          npm install

      - name: Run Tests
        id: tests
        run: |
          npx ng test seo-toolbox --watch=false --browsers=ChromeHeadless
        env:
          CHROME_FLAGS: "--no-sandbox --disable-dev-shm-usage"

      - name: Add Test Fail Comment
        if: always() && steps.tests.outcome == 'failure'
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: tests
          mode: recreate
          message: |
            Some tests are failing. Please fix them before merging.

      - name: Remove Test Fail Comment
        if: always() && steps.tests.outcome == 'success'
        uses: thollander/actions-comment-pull-request@v3
        with:
          comment-tag: tests
          mode: delete
          message: ""
